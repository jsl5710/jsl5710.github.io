# Navigation Links
#   To link a homepage section, specify the URL as a hash `#` followed by the
#   section id from layouts/landing/list.html (e.g. '/#about').
#   `weight` controls the order. Use `parent:` to create a dropdown.
#
# Structure: the scholarly record — publications, projects, talks — sits at the
# top level. Burying them in a dropdown made the things people actually come
# for take two clicks and a guess. Dropdowns now hold only the supporting
# material: written statements, and secondary activity pages.

main:
  - name: About
    url: '/#about'
    weight: 10

  # Primary outputs — top level, and pointing at the full listings rather than
  # a homepage excerpt, since those pages carry every entry.
  - name: Publications
    url: '/publication/'
    weight: 20

  - name: Projects
    url: '/project/'
    weight: 30

  - name: Talks
    url: '/event/'
    weight: 40

  # Research dropdown — the written statements only
  - name: Research
    weight: 50
    identifier: research
  - name: Research Overview
    url: '/research/'
    parent: research
    weight: 1
  - name: Research Statement
    url: '/research/research-statement/'
    parent: research
    weight: 2
  - name: Teaching Statement
    url: '/research/teaching-statement/'
    parent: research
    weight: 3
  - name: Mentorship Statement
    url: '/research/mentorship-statement/'
    parent: research
    weight: 4

  # Activities dropdown — secondary material
  - name: Activities
    weight: 60
    identifier: activities
  - name: Experience
    url: '/#experience'
    parent: activities
    weight: 1
  - name: News
    url: '/post/'
    parent: activities
    weight: 2
  - name: Service
    url: '/service/'
    parent: activities
    weight: 3
  - name: Gallery
    url: '/gallery/'
    parent: activities
    weight: 4

  - name: Contact
    url: '/#contact'
    weight: 70

  - name: CV
    url: uploads/jsl_cv.pdf
    weight: 80
